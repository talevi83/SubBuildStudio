[pytest]
pythonpath = .
testpaths = tests
markers =
    unit: Pure, fast unit tests with no database or external binary dependencies
    api: FastAPI + SQLite integration tests via TestClient
    pipeline: Subtitle pipeline orchestration, stage processing, and AI provider tests
    ffmpeg: Tests that invoke local ffmpeg/ffprobe binaries
    security: Authentication (X-SubBuild-Token), CSRF/Origin guard, security headers, FFmpeg SSRF, and upload limits
    smoke: Critical path sanity tests for rapid verification
    regression: Comprehensive regression suite covering edge cases and bug fixes
