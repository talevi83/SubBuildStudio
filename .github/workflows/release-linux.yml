name: Linux AppImage

# Builds SubBuild-Studio-Linux-x86_64.AppImage (and its .zsync, for AppImageUpdate / Gear Lever).
#  - On a release tag (vX.Y.Z, pushed by release-tag.bat): attaches both to that tag's GitHub
#    release (created once by release.yml), so
#    https://github.com/talevi83/SubBuildStudio/releases/latest/download/SubBuild-Studio-Linux-x86_64.AppImage
#    always points at the newest version.
#  - On a pull request that touches the Linux packaging, or "Run workflow" by hand: builds it and
#    keeps it as a downloadable artifact of the run, for testing before a release.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "packaging/linux/**"
      - "packaging/launcher.py"
      - "packaging/linux_desktop.py"
      - "packaging/requirements-desktop.txt"
      - "backend/requirements.txt"
      - "backend/app/core/gpu_runtime.py"
      - "backend/app/core/hardware.py"
      - ".github/workflows/release-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # The oldest supported system: the AppImage runs on its glibc (2.35) and newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all tags: git archive fills VERSION from the newest tag (export-subst)

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the interface
        working-directory: frontend
        # Type check + bundle only: the frontend tests already run in tests.yml
        run: |
          npm ci
          npx tsc -b
          npx vite build

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the build tools and the X11 libraries the AppImage bundles
        run: |
          sudo apt-get update
          # bundled: libxcb-*, libxkbcommon-x11 / for the smoke test of the Qt window: xvfb and
          # the libraries every desktop has (NSS, ALSA, OpenGL...)
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-util1 libxkbcommon-x11-0 binutils xvfb \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxkbfile1 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxshmfence1 libgbm1

      - name: Build the AppImage
        id: build
        run: bash packaging/linux/build-appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: SubBuild-Studio-Linux-x86_64-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.appimage }}
          if-no-files-found: error
          compression-level: 0   # an AppImage is already compressed

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # (the release itself is created once, by release.yml)
        run: >-
          bash .github/scripts/attach-to-release.sh "${{ github.ref_name }}"
          "${{ steps.build.outputs.appimage }}" "${{ steps.build.outputs.zsync }}"
