name: macOS app

# Builds SubBuild-Studio-macOS-AppleSilicon.dmg and SubBuild-Studio-macOS-Intel.dmg.
#  - On a release tag (vX.Y.Z, pushed by release-tag.bat): attaches both to that tag's GitHub
#    release (created once by release.yml), so
#    https://github.com/talevi83/SubBuildStudio/releases/latest/download/SubBuild-Studio-macOS-AppleSilicon.dmg
#    https://github.com/talevi83/SubBuildStudio/releases/latest/download/SubBuild-Studio-macOS-Intel.dmg
#    always point at the newest version.
#  - On a pull request that touches the macOS packaging, or "Run workflow" by hand: builds them and
#    keeps them as downloadable artifacts of the run, for testing before a release.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - "packaging/macos/**"
      - "packaging/launcher.py"
      - "packaging/requirements-desktop.txt"
      - "backend/requirements.txt"
      - ".github/workflows/release-macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: macOS ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15         # Apple Silicon (arm64)
            label: AppleSilicon
          - runner: macos-15-intel   # Intel (x86_64); GitHub keeps Intel runners until fall 2027
            label: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # all tags: git archive fills VERSION from the newest tag (export-subst)

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the interface
        working-directory: frontend
        # Type check + bundle only: the frontend tests already run in tests.yml
        run: |
          npm ci
          npx tsc -b
          npx vite build

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the app and the disk image
        id: build
        run: bash packaging/macos/build-app.sh

      - uses: actions/upload-artifact@v7
        with:
          name: SubBuild-Studio-macOS-${{ matrix.label }}-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.dmg }}
          if-no-files-found: error
          compression-level: 0   # a .dmg is already compressed

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # (the release itself is created once, by release.yml)
        run: bash .github/scripts/attach-to-release.sh "${{ github.ref_name }}" "${{ steps.build.outputs.dmg }}"
