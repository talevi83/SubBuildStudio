name: Release

# Creates the GitHub release of a release tag (vX.Y.Z, pushed by release-tag.bat), once, as soon as
# the tag arrives. The installer workflows (release-windows.yml, release-macos.yml,
# release-linux.yml) build in parallel and only attach their files to it: when each of them created
# the release itself, two that finished at the same moment could create two releases for one tag
# (v2.2.5), and the "latest" one could be the empty duplicate.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Already there, e.g. made by hand in GitHub's "Draft a new release": nothing to do
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
